name: Test and publish Demo

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      test_only:
        description: 'Callers (the PR check) only test; a direct dispatch tests and publishes'
        type: boolean
        default: true

jobs:
  run_demo_tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.x'
    - name: Test Demo
      run: dotnet test "./demo/Demo.Worker.Tests" --configuration Release
    - name: Publish Demo
      if: ${{ !inputs.test_only }}
      run: echo "PUBLISH STEP RAN (event=${{ github.event_name }}, test_only='${{ inputs.test_only }}')"
