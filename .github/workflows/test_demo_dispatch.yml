name: Test Demo

on:
  workflow_dispatch:
  workflow_call:

jobs:
  run_demo_tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.x'
    - name: Test Demo
      run: dotnet test "./demo/Demo.Worker.Tests" --configuration Release --logger "console;verbosity=detailed"
