name: Test Demo

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Also publish the win-x64 artifact'
        type: boolean
        default: false
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false

jobs:
  run_demo_tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.x'
    - name: Test Demo
      run: dotnet test "./demo/Demo.Worker.Tests" --configuration Release --logger "console;verbosity=detailed"

    # Experiment: can the tests run against the Windows target on Linux?
    - name: Test Demo against net8.0-windows (experiment)
      if: inputs.publish
      continue-on-error: true
      run: dotnet test "./demo/Demo.Worker.Tests" --configuration Release -p:TargetFramework=net8.0-windows -p:EnableWindowsTargeting=true --logger "console;verbosity=detailed"

    # Experiment: is EnableWindowsTargeting needed for a plain net8.0-windows worker?
    - name: Publish win-x64 without EnableWindowsTargeting (experiment)
      id: publish_plain
      if: inputs.publish
      continue-on-error: true
      run: dotnet publish "./demo/Demo.Worker/Demo.Worker.csproj" -c Release -r win-x64 -p:TargetFramework=net8.0-windows -o out
    - name: Publish win-x64 with EnableWindowsTargeting
      if: inputs.publish && steps.publish_plain.outcome == 'failure'
      run: dotnet publish "./demo/Demo.Worker/Demo.Worker.csproj" -c Release -r win-x64 -p:TargetFramework=net8.0-windows -p:EnableWindowsTargeting=true -o out
    - name: Inspect artifact
      if: inputs.publish
      run: |
        ls -la out
        file out/Demo.Worker.exe out/Demo.Worker.dll
        grep -c "net8.0-windows" out/Demo.Worker.dll && echo "dll contains the Windows flavor string"
    - uses: actions/upload-artifact@v4
      if: inputs.publish
      with:
        name: Demo-win-x64-${{ github.sha }}
        path: out
        retention-days: 1
